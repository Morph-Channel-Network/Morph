name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  rust:
    name: Rust workspace and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          components: clippy,rustfmt
          targets: riscv64imac-unknown-none-elf

      - name: Install native Linux development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang cmake libfontconfig-dev libfreetype-dev libxkbcommon-x11-dev libxcb-xinput-dev libxcb-cursor-dev libx11-xcb-dev libssl-dev libwayland-dev libvulkan-dev mesa-vulkan-drivers

      - name: Cache cargo build outputs
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install supply-chain tools
        run: |
          cargo install --locked --version 0.22.2 cargo-audit
          cargo install --locked --version 0.20.2 cargo-deny

      - name: Check formatting
        run: make fmt-check

      - name: Run clippy
        run: make lint

      - name: Check source hygiene
        run: make source-hygiene

      - name: Run supply-chain checks
        run: make supply-chain

      - name: Run workspace tests
        run: make test

      - name: Run bounded parser mutation campaign
        run: make fuzz-smoke

      - name: Retain parser mutation reports and failing inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: morph-parser-smoke-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/fuzz-campaigns/
          if-no-files-found: warn
          retention-days: 30

      - name: Run fixture checks
        run: make fixture-checks

      - name: Check native GPUI application
        run: make desktop-build

      - name: Stage native Linux package with source and license notices
        run: make package-desktop

      - name: Upload native desktop package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: morph-desktop-linux-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/morph-desktop-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Run contract tests
        run: make contract-tests

      - name: Verify pre-production release boundary
        run: make release-readiness

      - name: Package contract release
        run: make package-contract-release

      - name: Upload contract release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: morph-contracts-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/morph-current-custody.tar.gz
          if-no-files-found: error
          retention-days: 30

  attest-contracts:
    name: Attest main-branch contract release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download contract release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: morph-contracts-${{ github.sha }}
          path: target/attestation

      - name: Attest contract release provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: target/attestation/morph-current-custody.tar.gz
