name: Current protocol native acceptance

on:
  pull_request:
  workflow_dispatch:
    inputs:
      qualify_baseline:
        description: Run full local no-value W1 qualification and upload sanitized integrated evidence
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  native-e2e:
    name: Clean-head CKB lifecycle and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.qualify_baseline && 180 || 60 }}
    env:
      CKB_ARCHIVE: ckb_v0.210.0_x86_64-unknown-linux-gnu.tar.gz
      CKB_ARCHIVE_SHA256: 68a94c191109bae172f8dcb71828dbdf0383e2c314e0658743db217472b27bdf
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          components: clippy,rustfmt
          targets: riscv64imac-unknown-none-elf

      - name: Install full baseline dependencies
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.qualify_baseline }}
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang cmake libfontconfig-dev libfreetype-dev libxkbcommon-x11-dev libxcb-xinput-dev libxcb-cursor-dev libx11-xcb-dev libssl-dev libwayland-dev libvulkan-dev mesa-vulkan-drivers
          cargo install --locked --version 0.22.2 cargo-audit
          cargo install --locked --version 0.20.2 cargo-deny
          cargo install --locked --version 0.9.151 cargo-nextest

      - name: Prepare pinned public Fiber source for W1
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.qualify_baseline }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/nervosnetwork/fiber.git target/ci-fiber-source
          git -C target/ci-fiber-source checkout --detach "$(jq -er .fiber_revision integrations/fiber-shadow/manifest.json)"
          printf 'FIBER_SOURCE=%s/target/ci-fiber-source\n' "$GITHUB_WORKSPACE" >>"$GITHUB_ENV"

      - name: Cache cargo build outputs
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: current-native-acceptance

      - name: Install pinned CKB release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/ci-ckb
          curl --fail --location --retry 3 --connect-timeout 15 \
            "https://github.com/nervosnetwork/ckb/releases/download/v0.210.0/$CKB_ARCHIVE" \
            --output "target/ci-ckb/$CKB_ARCHIVE"
          printf '%s  %s\n' "$CKB_ARCHIVE_SHA256" "target/ci-ckb/$CKB_ARCHIVE" | sha256sum --check
          tar --extract --gzip --file "target/ci-ckb/$CKB_ARCHIVE" \
            --directory target/ci-ckb --strip-components=1
          target/ci-ckb/ckb --version

      - name: Prepare public no-value development key files
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_dir="$(mktemp -d "$RUNNER_TEMP/morph-ci-fixture-keys.XXXXXXXX")"
          chmod 700 "$key_dir"
          # These stock dev-genesis/disposable scalars are public fixtures.
          # Never use them for deployment credentials or real assets.
          printf '%s\n' 'd00c06bfd800d27397002dca6fb0993d5ba6399b4238b2f29ee9deb97593d2bc' >"$key_dir/deployer.key"
          printf '%064x\n' 2 >"$key_dir/alice.key"
          printf '%064x\n' 3 >"$key_dir/bob.key"
          printf 'MORPH_DEVNET_PRIVATE_KEY_FILE=%s/deployer.key\n' "$key_dir" >>"$GITHUB_ENV"
          printf 'MORPH_ALICE_PRIVATE_KEY_FILE=%s/alice.key\n' "$key_dir" >>"$GITHUB_ENV"
          printf 'MORPH_BOB_PRIVATE_KEY_FILE=%s/bob.key\n' "$key_dir" >>"$GITHUB_ENV"
          printf 'MORPH_CI_FIXTURE_KEY_DIR=%s\n' "$key_dir" >>"$GITHUB_ENV"

      - name: Run the sole native acceptance pipeline
        if: ${{ !inputs.qualify_baseline }}
        shell: bash
        run: |
          set -euo pipefail
          env -u MORPH_UPDATE_FIXTURES \
            CKB_BIN="$GITHUB_WORKSPACE/target/ci-ckb/ckb" \
            OUT_DIR="$RUNNER_TEMP/morph-native-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/run" \
            bash scripts/devnet-current-e2e.sh

      - name: Export public evidence
        if: ${{ !inputs.qualify_baseline }}
        # Keep per-attempt evidence outside Cargo's cached target directory.
        run: >-
          python3 scripts/export-current-public-evidence.py
          --run-dir "$RUNNER_TEMP/morph-native-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/run"
          --output-dir "$RUNNER_TEMP/morph-native-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/public-evidence"

      - name: Upload public acceptance evidence
        if: ${{ !inputs.qualify_baseline }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: morph-native-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/morph-native-${{ github.run_id }}-${{ github.run_attempt }}/public-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Qualify the full local candidate baseline
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.qualify_baseline }}
        shell: bash
        run: |
          set -euo pipefail
          env -u MORPH_UPDATE_FIXTURES \
            CKB_BIN="$GITHUB_WORKSPACE/target/ci-ckb/ckb" \
            OUT_DIR="$GITHUB_WORKSPACE/.local-evidence/ci-baseline" \
            bash scripts/qualify-local-candidate.sh

      - name: Upload only the sanitized integrated evidence bundle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.qualify_baseline }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: morph-integrated-baseline-${{ github.sha }}
          path: .local-evidence/ci-baseline/morph-integration-evidence.tar.gz
          include-hidden-files: true # Exact sanitized archive only, never the run directory.
          if-no-files-found: error
          retention-days: 30

      - name: Remove private fixture files
        if: always()
        shell: bash
        run: |
          if [ -n "${MORPH_CI_FIXTURE_KEY_DIR:-}" ]; then
            rm -rf -- "$MORPH_CI_FIXTURE_KEY_DIR"
          fi
