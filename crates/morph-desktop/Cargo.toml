[package]
name = "morph-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Native GPUI operator application for Morph"
publish = false

[dependencies]
anyhow.workspace = true
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
morph-sdk = { path = "../morph-sdk" }
morph-packages = { path = "../morph-packages" }
gpui-kit = { version = "=0.9.0", default-features = false, features = ["component", "assets"] }

[dev-dependencies]
gpui-kit = { version = "=0.9.0", default-features = false, features = ["component", "assets", "test-support"] }
