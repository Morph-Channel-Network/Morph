[package]
name = "morph-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description.workspace = true
readme.workspace = true
publish = false

[features]
default = []
devnet = ["morph-packages/devnet", "dep:morph-fiber-adapter", "dep:tokio"]

[dependencies]
tokio = { workspace = true, optional = true }
morph-fiber-adapter = { version = "4.0.0-alpha.1", path = "../morph-fiber-adapter", optional = true }
morph-events = { path = "../morph-events" }
morph-observability = { version = "4.0.0-alpha.1", path = "../morph-observability" }
morph-key-input = { version = "4.0.0-alpha.1", path = "../morph-key-input" }
morph-runtime-store = { path = "../morph-runtime-store" }
morph-signer = { path = "../morph-signer" }
zeroize.workspace = true
anyhow.workspace = true
ckb-crypto.workspace = true
ckb-hash.workspace = true
ckb-jsonrpc-types.workspace = true
ckb-types.workspace = true
clap.workspace = true
getrandom.workspace = true
hex.workspace = true
k256.workspace = true
morph-core = { version = "4.0.0-alpha.1", path = "../morph-core" }
morph-packages = { version = "4.0.0-alpha.1", path = "../morph-packages" }
morph-hub-api = { version = "4.0.0-alpha.1", path = "../morph-hub-api" }
morph-script-common = { version = "0.1.0", path = "../../contracts/morph-script-common" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
url = "2.5"


[dev-dependencies]
tempfile = "3"
morph-payment-gateway = { path = "../morph-payment-gateway" }
morph-packages = { version = "4.0.0-alpha.1", path = "../morph-packages", features = ["devnet"] }
morph-sdk = { path = "../morph-sdk" }
tokio.workspace = true
