[package]
name = "morph-xtask"
default-run = "morph-xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Rust acceptance and interoperability runners for Morph"

[dependencies]
morph-events = { path = "../morph-events" }
morph-runtime-store = { path = "../morph-runtime-store" }
hmac = "=0.13.0"
sha2-current = { package = "sha2", version = "=0.11.1" }
morph-script-common = { path = "../../contracts/morph-script-common" }
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
ckb-types.workspace = true
hex.workspace = true
k256.workspace = true
morph-core = { path = "../morph-core" }
morph-key-input = { path = "../morph-key-input" }
morph-sdk = { path = "../morph-sdk" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
