[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "riscv64imac-unknown-none-elf",
]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "workspace"
unsound = "workspace"
yanked = "warn"
# The former faster-hex waiver is removed: verified upstream-consumer patches
# select the actual patched registry release. No advisory is suppressed here.
ignore = []

[licenses]
confidence-threshold = 0.92
unused-allowed-license = "allow"
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

# Exact native-desktop exceptions, not a general MPL allowlist. The complete
# unchanged registry source archives and notices ship with desktop bundles;
# vendor/check.py verifies them against Cargo.lock. See docs/native-gui-dependencies.md.
[[licenses.exceptions]]
name = "option-ext"
version = "=0.2.0"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "cbindgen"
version = "=0.28.0"
allow = ["MPL-2.0"]

[licenses.private]
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = [
  { crate = "openssl", reason = "Morph CLI uses rustls-backed HTTP; OpenSSL should not enter the dependency graph." },
  { crate = "openssl-sys", reason = "Morph CLI uses rustls-backed HTTP; OpenSSL should not enter the dependency graph." },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Biscuit 6.0.0 on crates.io still depends on vulnerable crypto-bigint 0.5.
# Cargo.toml pins the upstream RustCrypto migration to an immutable revision.
# Remove this exception when a registry release includes that migration.
allow-git = ["https://github.com/biscuit-auth/biscuit-rust"]
