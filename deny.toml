[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "riscv64imac-unknown-none-elf",
]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "workspace"
unsound = "workspace"
yanked = "warn"
# Rationale and removal conditions live in the AUDIT_IGNORE comment block at
# the top of the Makefile; keep both lists in sync.
ignore = ["RUSTSEC-2026-0306"]

[licenses]
confidence-threshold = 0.92
unused-allowed-license = "allow"
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = [
  { crate = "openssl", reason = "Morph CLI uses rustls-backed HTTP; OpenSSL should not enter the dependency graph." },
  { crate = "openssl-sys", reason = "Morph CLI uses rustls-backed HTTP; OpenSSL should not enter the dependency graph." },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Biscuit 6.0.0 on crates.io still depends on vulnerable crypto-bigint 0.5.
# Cargo.toml pins the upstream RustCrypto migration to an immutable revision.
# Remove this exception when a registry release includes that migration.
allow-git = ["https://github.com/biscuit-auth/biscuit-rust"]
